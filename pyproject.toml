[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scoutswap"
version = "0.1.0"
description = "Find value-conscious replacements for football players."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
]

[project.scripts]
scoutswap-audit = "scoutswap.audit:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-httpx>=0.30,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
